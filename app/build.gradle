plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'group.four.nyare'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withJavadocJar()
}

repositories {
    mavenCentral()
}

sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.dev.output
        runtimeClasspath += sourceSets.dev.output
    }
}

configurations {
    devImplementation.extendsFrom implementation
    devRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation platform("org.springframework.ai:spring-ai-bom:2.0.0")
    implementation platform("me.paulschwarz:spring-dotenv-bom:5.1.0")
    developmentOnly platform("me.paulschwarz:spring-dotenv-bom:5.1.0")
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.xerial:sqlite-jdbc'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly "me.paulschwarz:springboot4-dotenv"
    devImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    testImplementation "me.paulschwarz:springboot4-dotenv"
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    implementation 'org.apache.commons:commons-csv:1.14.0'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'spring.profiles.active', 'test'
}

tasks.withType(org.springframework.boot.gradle.tasks.run.BootRun).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('devRun', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the application with the nyare.dev fixtures'
    mainClass = 'group.four.nyare.nyare.NyareApplication'
    classpath = sourceSets.main.runtimeClasspath + configurations.developmentOnly + sourceSets.dev.runtimeClasspath
    dependsOn tasks.named('devClasses')
}

tasks.withType(Javadoc).configureEach {
    destinationDir = file("docs/javadoc")
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        author = true
        version = true
        addBooleanOption('Xdoclint:none', true)
    }
}